name: Generate Shorts Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies (FFmpeg & Fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-dejavu-core


    - name: Install system dependencies (FFmpeg, ImageMagick & Fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run video generator script
      run: |
        python main.py

    - name: Upload generated video
      uses: actions/upload-artifact@v4
      with:
        name: noahs-ark-shorts
        path: output.mp4
