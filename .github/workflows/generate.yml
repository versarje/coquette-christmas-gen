name: Generate Coquette Designs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub Actions'ın repona dosya yükleyebilmesi için yetki verir
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run design generator
      run: python main.py

    - name: Commit and Push Generated Image
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add output/
        git commit -m "Auto-generate clean coquette typography image" || echo "No changes to commit"
        git pull --rebase origin main || echo "Pull skipped or not needed"
        git push
